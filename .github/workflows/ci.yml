name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    runs-on: [self-hosted, linux, flutter]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed . || true
        # `|| true` for now — Hiddify upstream has inconsistent formatting we don't want to touch yet

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true
        # `|| true` while we adopt the codebase — once stable we'll remove

      - name: Summary
        run: echo "::notice::Phase 0 CI baseline ✓ (analyze runs, results non-blocking)"
